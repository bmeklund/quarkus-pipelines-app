##############################################################################
# Quarkus Pipelines App — OpenShift Deployment
#
# Before applying, replace YOUR_NAMESPACE with the namespace you are
# deploying into (e.g. tekton-workshop-user1). This namespace is used both
# as the deployment target and as the Tekton namespace the app will monitor.
#
#   sed 's/YOUR_NAMESPACE/tekton-workshop-user1/g' deployment.yaml | oc apply -f -
#
# The ClusterRoleBinding grants the ServiceAccount cross-namespace read
# access to Tekton resources. The subject namespace MUST match the namespace
# where the ServiceAccount lives (i.e. the deployment namespace).
##############################################################################

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipelines-dashboard
  namespace: YOUR_NAMESPACE
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
    app.kubernetes.io/part-of: pipelines-dashboard

---
# ClusterRole: read access to Tekton resources cluster-wide
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pipelines-dashboard-viewer
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
    app.kubernetes.io/part-of: pipelines-dashboard
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns", "pipelines", "tasks"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]

---
# IMPORTANT: subjects[].namespace must match the namespace the ServiceAccount is deployed in
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pipelines-dashboard-viewer-binding
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
    app.kubernetes.io/part-of: pipelines-dashboard
subjects:
  - kind: ServiceAccount
    name: pipelines-dashboard
    namespace: YOUR_NAMESPACE
roleRef:
  kind: ClusterRole
  name: pipelines-dashboard-viewer
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipelines-dashboard-config
  namespace: YOUR_NAMESPACE
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
    app.kubernetes.io/part-of: pipelines-dashboard
data:
  # The Tekton namespace this dashboard instance monitors (passed to the app at runtime)
  namespace: "YOUR_NAMESPACE"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-pipelines-app
  namespace: YOUR_NAMESPACE
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: pipelines-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quarkus-pipelines-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quarkus-pipelines-app
        app.kubernetes.io/version: "1.0.0"
    spec:
      serviceAccountName: pipelines-dashboard
      containers:
        - name: quarkus-pipelines-app
          # Build image with: IMAGE_REPO=quay.io/yourorg/quarkus-pipelines-app ./build.sh
          image: quay.io/yourorg/quarkus-pipelines-app:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: QUARKUS_HTTP_PORT
              value: "8080"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Sets quarkus.kubernetes-client.namespace — the Tekton namespace to monitor
            - name: QUARKUS_KUBERNETES_CLIENT_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: pipelines-dashboard-config
                  key: namespace
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /q/health/started
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: quarkus-pipelines-app
  namespace: YOUR_NAMESPACE
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
    app.kubernetes.io/part-of: pipelines-dashboard
spec:
  selector:
    app.kubernetes.io/name: quarkus-pipelines-app
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: quarkus-pipelines-app
  namespace: YOUR_NAMESPACE
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
    app.kubernetes.io/part-of: pipelines-dashboard
spec:
  to:
    kind: Service
    name: quarkus-pipelines-app
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
