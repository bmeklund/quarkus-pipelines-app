##############################################################################
# Quarkus Pipelines App — OpenShift Deployment
#
# This manifest is namespace-scoped. Replace YOUR_NAMESPACE at deploy time with
# the namespace that should own the deployment and Tekton resources, for example
# tekton-workshop-user1 through tekton-workshop-user99. The ConfigMap value below
# sets quarkus.kubernetes-client.namespace for the running app.
##############################################################################

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipelines-dashboard
  namespace: YOUR_NAMESPACE
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
    app.kubernetes.io/part-of: pipelines-dashboard

---
# Role: read-only access to dashboard data in the configured namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipelines-dashboard-viewer
  namespace: YOUR_NAMESPACE
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
    app.kubernetes.io/part-of: pipelines-dashboard
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns", "pipelines", "tasks"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipelines-dashboard-viewer-binding
  namespace: YOUR_NAMESPACE
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
    app.kubernetes.io/part-of: pipelines-dashboard
subjects:
  - kind: ServiceAccount
    name: pipelines-dashboard
    namespace: YOUR_NAMESPACE
roleRef:
  kind: Role
  name: pipelines-dashboard-viewer
  apiGroup: rbac.authorization.k8s.io

---
# Role: create-only access for user-triggered PipelineRuns
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipelines-dashboard-run-creator
  namespace: YOUR_NAMESPACE
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
    app.kubernetes.io/part-of: pipelines-dashboard
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipelines-dashboard-run-creator-binding
  namespace: YOUR_NAMESPACE
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
    app.kubernetes.io/part-of: pipelines-dashboard
subjects:
  - kind: ServiceAccount
    name: pipelines-dashboard
    namespace: YOUR_NAMESPACE
roleRef:
  kind: Role
  name: pipelines-dashboard-run-creator
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipelines-dashboard-config
  namespace: YOUR_NAMESPACE
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
    app.kubernetes.io/part-of: pipelines-dashboard
data:
  # The Tekton namespace this dashboard instance monitors (passed to the app at runtime)
  namespace: "YOUR_NAMESPACE"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-pipelines-app
  namespace: YOUR_NAMESPACE
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: pipelines-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quarkus-pipelines-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quarkus-pipelines-app
        app.kubernetes.io/version: "1.0.0"
    spec:
      serviceAccountName: pipelines-dashboard
      containers:
        - name: quarkus-pipelines-app
          # Build image with: IMAGE_REPO=quay.io/yourorg/quarkus-pipelines-app ./build.sh
          image: quay.io/yourorg/quarkus-pipelines-app:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: QUARKUS_HTTP_PORT
              value: "8080"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Sets quarkus.kubernetes-client.namespace — the Tekton namespace to monitor
            - name: QUARKUS_KUBERNETES_CLIENT_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: pipelines-dashboard-config
                  key: namespace
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /q/health/started
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: quarkus-pipelines-app
  namespace: YOUR_NAMESPACE
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
    app.kubernetes.io/part-of: pipelines-dashboard
spec:
  selector:
    app.kubernetes.io/name: quarkus-pipelines-app
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: quarkus-pipelines-app
  namespace: YOUR_NAMESPACE
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
    app.kubernetes.io/part-of: pipelines-dashboard
spec:
  to:
    kind: Service
    name: quarkus-pipelines-app
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
