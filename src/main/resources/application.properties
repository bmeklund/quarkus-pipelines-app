# Application
quarkus.application.name=quarkus-pipelines-app
quarkus.application.version=1.0.0-SNAPSHOT

# HTTP
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*

# Quinoa - SPA frontend
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.dev-server.check-path=/
quarkus.quinoa.ignored-path-prefixes=/api,/q

# Health
quarkus.smallrye-health.root-path=/q/health

# OpenShift / Kubernetes client
quarkus.kubernetes-client.trust-certs=true
quarkus.kubernetes-client.namespace=bmeklund-dev

# OpenShift deployment
quarkus.container-image.build=false
quarkus.container-image.group=quarkus-pipelines
quarkus.container-image.name=quarkus-pipelines-app
quarkus.container-image.tag=latest
quarkus.openshift.route.expose=true

quarkus.openshift.liveness-probe.http-action-path=/q/health/live
quarkus.openshift.readiness-probe.http-action-path=/q/health/ready

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.redhat.pipelines".level=DEBUG
quarkus.log.category."io.fabric8".level=DEBUG

# Dev mode overrides - copy to application-local.properties and fill in your values (do not commit)
%dev.quarkus.kubernetes-client.api-server-url=https://your-openshift-api-server:6443
%dev.quarkus.kubernetes-client.token=your-token-here

# Test overrides
%test.quarkus.kubernetes-client.api-server-url=https://localhost:6443
%test.quarkus.kubernetes-client.trust-certs=true
