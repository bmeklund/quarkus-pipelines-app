# Application
quarkus.application.name=quarkus-pipelines-app
quarkus.application.version=1.0.0-SNAPSHOT
quarkus.package.jar.type=uber-jar

# HTTP
quarkus.http.port=8080
# CORS only needed in dev (Vite :5173 vs backend :8080); in prod Quinoa serves from same origin
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:5173

# Quinoa - SPA frontend
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.dev-server.check-path=/
quarkus.quinoa.ignored-path-prefixes=/api,/q

# Health
quarkus.smallrye-health.root-path=/q/health

# OpenShift / Kubernetes client
%dev.quarkus.kubernetes-client.trust-certs=true
# Dev mode overrides - create src/main/resources/application-dev.properties with real values (gitignored, never commit)
quarkus.kubernetes-client.namespace=tekton-workshop-user1

# OpenShift deployment
quarkus.container-image.build=false
quarkus.container-image.group=quarkus-pipelines
quarkus.container-image.name=quarkus-pipelines-app
quarkus.container-image.tag=latest
quarkus.openshift.route.expose=true

quarkus.openshift.liveness-probe.http-action-path=/q/health/live
quarkus.openshift.readiness-probe.http-action-path=/q/health/ready

# RBAC: grant the app's ServiceAccount read access for dashboard data and create-only access for triggered runs.
quarkus.openshift.rbac.roles.pipeline-dashboard-viewer.policy-rules.0.api-groups=tekton.dev
quarkus.openshift.rbac.roles.pipeline-dashboard-viewer.policy-rules.0.resources=pipelineruns,taskruns,pipelines,tasks
quarkus.openshift.rbac.roles.pipeline-dashboard-viewer.policy-rules.0.verbs=get,list,watch
quarkus.openshift.rbac.roles.pipeline-dashboard-viewer.policy-rules.1.api-groups=
quarkus.openshift.rbac.roles.pipeline-dashboard-viewer.policy-rules.1.resources=pods
quarkus.openshift.rbac.roles.pipeline-dashboard-viewer.policy-rules.1.verbs=get,list,watch
quarkus.openshift.rbac.role-bindings.pipeline-dashboard-viewer-binding.role-name=pipeline-dashboard-viewer
quarkus.openshift.rbac.role-bindings.pipeline-dashboard-viewer-binding.subjects.quarkus-pipelines-app.kind=ServiceAccount

quarkus.openshift.rbac.roles.pipelinerun-creator.policy-rules.0.api-groups=tekton.dev
quarkus.openshift.rbac.roles.pipelinerun-creator.policy-rules.0.resources=pipelineruns
quarkus.openshift.rbac.roles.pipelinerun-creator.policy-rules.0.verbs=create
quarkus.openshift.rbac.role-bindings.pipelinerun-creator-binding.role-name=pipelinerun-creator
quarkus.openshift.rbac.role-bindings.pipelinerun-creator-binding.subjects.quarkus-pipelines-app.kind=ServiceAccount
quarkus.openshift.resources.requests.cpu=100m
quarkus.openshift.resources.requests.memory=256Mi
quarkus.openshift.resources.limits.cpu=500m
quarkus.openshift.resources.limits.memory=512Mi


# Logging
quarkus.log.level=INFO
quarkus.log.category."com.redhat.pipelines".level=DEBUG
quarkus.log.category."io.fabric8".level=DEBUG

# Dev mode overrides - create src/main/resources/application-dev.properties with real values (gitignored, never commit)
quarkus.kubernetes-client.api-server-url=https://your-openshift-api-server:6443
quarkus.kubernetes-client.token=your-token-here

# Test overrides
%test.quarkus.kubernetes-client.api-server-url=https://localhost:6443
%test.quarkus.kubernetes-client.trust-certs=true
