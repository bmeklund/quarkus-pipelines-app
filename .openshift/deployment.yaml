---
# ServiceAccount with permissions to read PipelineRuns and TaskRuns
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipelines-dashboard
  namespace: default
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
    app.kubernetes.io/part-of: pipelines-dashboard

---
# ClusterRole: read-only access to Tekton resources across namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pipelines-dashboard-viewer
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns", "pipelines", "tasks"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pipelines-dashboard-viewer-binding
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
subjects:
  - kind: ServiceAccount
    name: pipelines-dashboard
    namespace: default
roleRef:
  kind: ClusterRole
  name: pipelines-dashboard-viewer
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-pipelines-app
  namespace: default
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: pipelines-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quarkus-pipelines-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quarkus-pipelines-app
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/q/metrics"
    spec:
      serviceAccountName: pipelines-dashboard
      containers:
        - name: quarkus-pipelines-app
          image: quarkus-pipelines/quarkus-pipelines-app:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: QUARKUS_HTTP_PORT
              value: "8080"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: APP_PIPELINES_NAMESPACES
              valueFrom:
                configMapKeyRef:
                  name: pipelines-dashboard-config
                  key: namespaces
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: pipelines-dashboard-config
                  key: otel-endpoint
                  optional: true
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /q/health/started
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: quarkus-pipelines-app
  namespace: default
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
spec:
  selector:
    app.kubernetes.io/name: quarkus-pipelines-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: quarkus-pipelines-app
  namespace: default
  labels:
    app.kubernetes.io/name: quarkus-pipelines-app
spec:
  to:
    kind: Service
    name: quarkus-pipelines-app
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipelines-dashboard-config
  namespace: default
data:
  namespaces: "default"
  otel-endpoint: "http://otel-collector:4317"
